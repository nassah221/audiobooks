[project]
name = "audiobook"
version = "0.1.0"
description = "Private Qwen3-TTS + Bragg-reference audiobook generation (Apple Silicon MLX). Frozen behavior: pinned model/deps, non-stream sentence generation, PCM16 checkpoints, no mastering."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx==0.32.0",
    "mlx-audio==0.4.8",
    "mlx-whisper==0.4.3",
    "numpy==2.5.2",
    "soundfile==0.14.0",
]

[project.scripts]
audiobook = "audiobook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiobook"]
